name: Web UI checks

on:
  pull_request:
    paths:
      - 'AgentForge.Web/**'
      - '.github/workflows/web-ui.yml'
  push:
    branches: [main]
    paths:
      - 'AgentForge.Web/**'
      - '.github/workflows/web-ui.yml'

jobs:
  web-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install CSS tooling
        working-directory: AgentForge.Web
        run: npm install --no-audit --no-fund
      - name: Compile Tailwind CSS
        working-directory: AgentForge.Web
        run: npm run build:css
      - name: Check generated utilities
        working-directory: AgentForge.Web
        run: |
          node -e "const css=require('fs').readFileSync('wwwroot/css/app.css','utf8'); for(const token of ['grid-cols-1','rounded-xl','text-heading']) { if(!css.includes(token)) { console.error('Missing Tailwind utility: '+token); process.exitCode=1; } }"
      - name: Check JavaScript syntax
        run: find AgentForge.Web/wwwroot/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Build web application
        run: dotnet build AgentForge.Web/AgentForge.Web.csproj --configuration Release

      - name: Install browser test runner
        working-directory: AgentForge.Web
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Chromium smoke tests
        run: |
          ASPNETCORE_URLS=http://127.0.0.1:5088 dotnet run --no-build --configuration Release --project AgentForge.Web/AgentForge.Web.csproj > /tmp/agentforge-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill $WEB_PID || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5088/chat >/dev/null; then break; fi
            sleep 2
          done
          if ! curl -fsS http://127.0.0.1:5088/chat >/dev/null; then cat /tmp/agentforge-web.log; exit 1; fi
          node AgentForge.Web/tests/ui-smoke.cjs
